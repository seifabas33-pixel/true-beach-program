<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>True Beach Resort — Programme</title>
<style>
  :root { --brown:#3a2e26; --clay:#b95c37; --cream:#fdf8ee; --teal:#2d4a48; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--brown);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { text-align:center; padding:28px 20px 18px; }
  h1 { margin:0; font-size:30px; font-weight:600; letter-spacing:6px; }
  .sub { margin:6px 0 0; font-size:12px; letter-spacing:4px; color:var(--brown); }
  .rule { width:120px; height:2px; background:var(--clay); margin:12px auto; }
  .tag { font-size:11px; letter-spacing:2px; color:var(--teal); margin:0; }
  nav { display:flex; gap:10px; justify-content:center; padding:0 16px 18px; }
  nav a { flex:1; max-width:220px; text-align:center; text-decoration:none; padding:12px 8px;
          border:1.5px solid var(--clay); border-radius:10px; color:var(--clay);
          font-size:13px; letter-spacing:1px; }
  section { padding:0 12px 28px; }
  h2 { font-size:15px; letter-spacing:3px; text-align:center; margin:22px 0 12px; font-weight:600; }
  img { width:100%; max-width:820px; display:block; margin:0 auto; border-radius:12px; }
  footer { text-align:center; font-size:11px; letter-spacing:2px; color:var(--teal);
           padding:8px 20px 40px; }
</style>
</head>
<body>
<header>
  <h1>TRUE</h1>
  <div class="rule"></div>
  <p class="sub">BEACH RESORT</p>
  <p class="tag" style="margin-top:8px">THE SEA IS YOUR SECRET KEEPER</p>
</header>

<nav>
  <a href="#evening">Evening shows</a>
  <a href="#kids">Kids club</a>
</nav>

<section id="evening">
  <h2>ENTERTAINMENT PROGRAMME</h2>
  <img src="entertainment.jpg" alt="Weekly entertainment programme">
</section>

<section id="kids">
  <h2>KIDS CLUB</h2>
  <img src="kids-club.jpg" alt="Kids club weekly activity programme">
</section>

<footer>CREATE MEMORIES — EVERY EVENING AT TRUE BEACH RESORT</footer>
</body>
</html>
